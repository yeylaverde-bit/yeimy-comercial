<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negocios · CRM Yeimy Laverde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8fa; --panel:#ffffff; --line:#dfe3eb; --line2:#cbd6e2;
    --txt:#33475b; --muted:#7c98b6; --soft:#516f90;
    --accent:#ff7a59; --teal:#00a4bd; --link:#0091ae;
    --nav:#2d3e50; --nav-h:#425066;
    --shadow:0 1px 2px rgba(45,62,80,.08),0 2px 6px rgba(45,62,80,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Lexend Deca",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  .app{display:flex;height:100vh;overflow:hidden}
  .rail{width:68px;background:var(--nav);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;flex-shrink:0}
  .rail .brand{color:#fff;font-weight:700;font-size:11px;text-align:center;line-height:1.1;margin-bottom:14px;padding:0 6px}
  .rail a{width:48px;height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#aeb9c7;text-decoration:none;font-size:9px}
  .rail a .ic{font-size:19px}
  .rail a:hover{background:var(--nav-h);color:#fff}
  .rail a.activo{background:var(--accent);color:#fff}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px}
  .top h1{margin:0;font-size:19px;font-weight:700}
  .top .count{color:var(--muted);font-size:13px;margin-top:2px}
  .board{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;gap:14px;padding:20px 22px;align-items:flex-start}
  .col{width:270px;flex-shrink:0;background:#eef2f7;border-radius:10px;display:flex;flex-direction:column;max-height:100%}
  .col > .ch{padding:12px 14px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .col .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%}
  .col .n{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--soft);font-weight:600}
  .cards{padding:10px;overflow-y:auto;flex:1;min-height:60px;display:flex;flex-direction:column;gap:9px}
  .cards.over{background:#e3ecf5;outline:2px dashed var(--line2);outline-offset:-6px;border-radius:8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;box-shadow:var(--shadow);cursor:grab}
  .card:active{cursor:grabbing}
  .card.drag{opacity:.4}
  .card .nm2{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#00a4bd,#0091ae);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:12px;flex-shrink:0}
  .card .moto{font-size:12px;color:var(--soft);margin-top:7px}
  .chipet{display:inline-block;background:#fde9e3;color:#c4472a;border-radius:4px;padding:2px 9px;font-size:11px;font-weight:600}
  .card .tl{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
  .card a{color:var(--link);text-decoration:none;font-weight:600}
  .vacio{color:var(--muted);font-size:12px;text-align:center;padding:14px}
  @media(max-width:720px){.rail{width:56px}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">CRM<br>Yeimy</div>
    <a href="/inbox"><span class="ic">📥</span>Bandeja</a>
    <a href="/contactos"><span class="ic">👥</span>Contactos</a>
    <a href="/negocios" class="activo"><span class="ic">🤝</span>Negocios</a>
    <a href="/panel"><span class="ic">📊</span>Tablero</a>
  </nav>
  <div class="main">
    <div class="top">
      <h1>🤝 Negocios</h1>
      <div class="count" id="count">cargando…</div>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>
<script>
const ETAPAS = [
  {id:"nuevo",    nombre:"Nuevo",    color:"#7c98b6"},
  {id:"cotizado", nombre:"Cotizado", color:"#00a4bd"},
  {id:"visita",   nombre:"Visita",   color:"#ff7a59"},
  {id:"vendido",  nombre:"Vendido",  color:"#00bda5"},
  {id:"perdido",  nombre:"Perdido",  color:"#e0697f"},
];
const ini = n => (String(n||"?").trim().charAt(0)||"?").toUpperCase();
const esc = s => String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = ms => { try{ return new Date(ms).toLocaleDateString("es-CO",{day:"2-digit",month:"short"});}catch{return"";} };
let leads = [];

async function cargar(){
  try{
    const r = await fetch("/api/whatsapp/conversaciones");
    const d = await r.json(); if(!d.ok) return;
    leads = d.conversaciones||[];
    document.querySelector("#count").textContent = `${leads.length} negocio(s) en el embudo`;
    pintar();
  }catch(e){}
}
function tarjeta(c){
  return `<div class="card" draggable="true" data-tel="${c.telefono}">
    <div class="nm2"><div class="avatar">${esc(ini(c.nombre||c.telefono))}</div>${esc(c.nombre||("+"+c.telefono))}</div>
    ${c.etiqueta?`<div style="margin-top:7px"><span class="chipet">${esc(c.etiqueta)}</span></div>`:""}
    ${c.moto?`<div class="moto">🏍️ ${esc(c.moto)}</div>`:""}
    <div class="tl"><span>+${esc(c.telefono)}</span><a href="/inbox">Ver chat →</a></div>
  </div>`;
}
function pintar(){
  const board = document.querySelector("#board");
  board.innerHTML = ETAPAS.map(e=>{
    const items = leads.filter(c=>(c.estado||"nuevo")===e.id);
    return `<div class="col">
      <div class="ch"><span class="nm"><span class="dot" style="background:${e.color}"></span>${e.nombre}</span><span class="n">${items.length}</span></div>
      <div class="cards" data-etapa="${e.id}">${items.map(tarjeta).join("")||'<div class="vacio">Arrastra aquí</div>'}</div>
    </div>`;
  }).join("");
  activarDnD();
}
function activarDnD(){
  let arrastrada = null;
  document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("dragstart",()=>{ arrastrada=card; card.classList.add("drag"); });
    card.addEventListener("dragend",()=>{ card.classList.remove("drag"); arrastrada=null; });
  });
  document.querySelectorAll(".cards").forEach(zona=>{
    zona.addEventListener("dragover",e=>{ e.preventDefault(); zona.classList.add("over"); });
    zona.addEventListener("dragleave",()=>zona.classList.remove("over"));
    zona.addEventListener("drop",async e=>{
      e.preventDefault(); zona.classList.remove("over");
      if(!arrastrada) return;
      const tel = arrastrada.dataset.tel;
      const estado = zona.dataset.etapa;
      const lead = leads.find(c=>c.telefono===tel);
      if(lead){ lead.estado = estado; }
      pintar();
      try{ await fetch("/api/whatsapp/estado",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telefono:tel,estado})}); }
      catch(err){ alert("No se pudo guardar el cambio"); }
    });
  });
}
cargar(); setInterval(cargar,20000);
</script>
</body>
</html>
