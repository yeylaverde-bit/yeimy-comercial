<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox WhatsApp · Serviautec</title>
<style>
  :root{
    --bg:#0b1220; --panel:#131c2e; --panel2:#0f172a; --line:#233049;
    --txt:#e6ecf7; --muted:#7c88a6; --accent:#25d366; --accent2:#7c5cff;
    --in:#1e293b; --out:#166534;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .app{display:flex;height:100vh;overflow:hidden}
  /* Lista */
  .lista{width:340px;min-width:280px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;background:var(--panel2)}
  .lista header{padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .lista header .logo{font-weight:700;font-size:16px}
  .lista header .sub{color:var(--muted);font-size:11px}
  .buscar{padding:10px 12px;border-bottom:1px solid var(--line)}
  .buscar input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:13px}
  .convos{flex:1;overflow-y:auto}
  .convo{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center}
  .convo:hover{background:var(--panel)}
  .convo.activo{background:var(--panel)}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#04210f;flex-shrink:0}
  .convo .info{flex:1;min-width:0}
  .convo .nombre{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo .ult{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo .hora{font-size:10.5px;color:var(--muted);flex-shrink:0;align-self:flex-start}
  /* Chat */
  .chat{flex:1;display:flex;flex-direction:column;background:
    radial-gradient(circle at 20% 10%, #16203400 0, transparent 40%), var(--bg)}
  .chat .vacio{margin:auto;color:var(--muted);text-align:center;padding:40px}
  .chat header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel2)}
  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
  .burbuja{max-width:72%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;word-wrap:break-word}
  .burbuja .meta{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
  .entrante{align-self:flex-start;background:var(--in);border-top-left-radius:3px}
  .saliente{align-self:flex-end;background:var(--out);border-top-right-radius:3px}
  .componer{padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--panel2)}
  .componer textarea{flex:1;resize:none;height:44px;max-height:120px;padding:11px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:14px;font-family:inherit}
  .componer button{padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:#04210f;font-weight:700;cursor:pointer;font-size:14px}
  .componer button:disabled{opacity:.5;cursor:not-allowed}
  .aviso{background:#3b2a0a;color:#ffd38a;padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:center}
  .badge{background:var(--accent);color:#04210f;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:700}
  @media(max-width:720px){.lista{width:100%;position:absolute;inset:0;z-index:2}.lista.oculta{display:none}.chat{width:100%}.volver{display:inline-block!important}}
  .volver{display:none;background:none;border:0;color:var(--accent);font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside class="lista" id="lista">
    <header>
      <div style="width:36px;height:36px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px">💬</div>
      <div><div class="logo">Inbox WhatsApp</div><div class="sub" id="sub">Serviautec · cargando…</div></div>
    </header>
    <div class="buscar"><input id="q" placeholder="Buscar conversación…"></div>
    <div class="convos" id="convos"></div>
  </aside>
  <main class="chat">
    <div id="avisoEnvio" class="aviso" style="display:none">⚠️ Responder aún no está activo: falta configurar el token de WhatsApp en el servidor. Por ahora solo puedes LEER.</div>
    <div class="vacio" id="vacio">Selecciona una conversación para verla 👈</div>
    <div id="panelChat" style="display:none;flex:1;flex-direction:column;min-height:0">
      <header>
        <button class="volver" id="volver">‹</button>
        <div class="avatar" id="chatAvatar">?</div>
        <div><div style="font-weight:600" id="chatNombre">—</div><div class="sub" id="chatTel" style="color:var(--muted);font-size:12px"></div></div>
      </header>
      <div class="msgs" id="msgs"></div>
      <div class="componer">
        <textarea id="texto" placeholder="Escribe una respuesta…"></textarea>
        <button id="enviar">Enviar</button>
      </div>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
let convos = [], actual = null, envioListo = false, timerMsgs = null;
const fmtHora = ms => { try { return new Date(ms).toLocaleString("es-CO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); } catch { return ""; } };
const ini = n => (n||"?").trim().charAt(0).toUpperCase() || "?";
const esc = s => String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function cargarConvos(){
  try{
    const r = await fetch("/api/whatsapp/conversaciones");
    const d = await r.json();
    if(!d.ok) return;
    convos = d.conversaciones || [];
    envioListo = d.envioListo;
    $("#sub").textContent = `Serviautec · ${convos.length} conversación(es)`;
    $("#avisoEnvio").style.display = envioListo ? "none" : "block";
    pintarConvos();
  }catch(e){}
}
function pintarConvos(){
  const q = ($("#q").value||"").toLowerCase();
  const list = convos.filter(c => !q || (c.nombre||"").toLowerCase().includes(q) || (c.telefono||"").includes(q));
  $("#convos").innerHTML = list.map(c => `
    <div class="convo ${actual===c.telefono?'activo':''}" data-tel="${c.telefono}">
      <div class="avatar">${esc(ini(c.nombre||c.telefono))}</div>
      <div class="info">
        <div class="nombre">${esc(c.nombre||("+"+c.telefono))}</div>
        <div class="ult">${esc(c.ultimoTexto||"")}</div>
      </div>
      <div class="hora">${fmtHora(c.ultimoMsg)}</div>
    </div>`).join("") || `<div style="padding:24px;color:var(--muted);text-align:center;font-size:13px">Sin conversaciones todavía.<br>Cuando un cliente escriba, aparece aquí.</div>`;
  document.querySelectorAll(".convo").forEach(el => el.onclick = () => abrir(el.dataset.tel));
}
async function abrir(tel){
  actual = tel;
  const c = convos.find(x=>x.telefono===tel) || {telefono:tel};
  $("#vacio").style.display="none";
  $("#panelChat").style.display="flex";
  $("#chatNombre").textContent = c.nombre || ("+"+tel);
  $("#chatTel").textContent = "+"+tel;
  $("#chatAvatar").textContent = ini(c.nombre||tel);
  $("#lista").classList.add("oculta");
  $("#enviar").disabled = !envioListo;
  pintarConvos();
  await cargarMsgs();
  if(timerMsgs) clearInterval(timerMsgs);
  timerMsgs = setInterval(cargarMsgs, 5000);
}
async function cargarMsgs(){
  if(!actual) return;
  try{
    const r = await fetch("/api/whatsapp/conversacion?telefono="+encodeURIComponent(actual));
    const d = await r.json();
    if(!d.ok) return;
    const html = (d.mensajes||[]).map(m => `
      <div class="burbuja ${m.direccion==='saliente'?'saliente':'entrante'}">
        ${esc(m.texto)}
        <div class="meta">${m.agente?esc(m.agente)+' · ':''}${fmtHora(new Date(m.ts).getTime())}</div>
      </div>`).join("");
    const box = $("#msgs");
    const abajo = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = html || `<div style="margin:auto;color:var(--muted)">Sin mensajes.</div>`;
    if(abajo) box.scrollTop = box.scrollHeight;
  }catch(e){}
}
async function enviar(){
  const texto = $("#texto").value.trim();
  if(!texto || !actual) return;
  $("#enviar").disabled = true;
  try{
    const r = await fetch("/api/whatsapp/responder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telefono:actual,texto})});
    const d = await r.json();
    if(d.ok){ $("#texto").value=""; await cargarMsgs(); await cargarConvos(); }
    else alert("No se pudo enviar: "+(d.error||""));
  }catch(e){ alert("Error de red"); }
  $("#enviar").disabled = !envioListo;
}
$("#enviar").onclick = enviar;
$("#texto").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); enviar(); }});
$("#q").addEventListener("input", pintarConvos);
$("#volver").onclick = () => { $("#lista").classList.remove("oculta"); actual=null; if(timerMsgs)clearInterval(timerMsgs); };
cargarConvos();
setInterval(cargarConvos, 8000);
</script>
</body>
</html>
