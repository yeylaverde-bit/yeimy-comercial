<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🚀 Crear oportunidad · Impulsa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:#0e1424; color:#e8ecf6; }
  .wrap{ max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header{ position:sticky; top:0; z-index:2; padding:14px 16px; color:#fff;
    background:linear-gradient(135deg,#4f46e5,#06b6d4); box-shadow:0 4px 14px rgba(0,0,0,.3); }
  header h1{ margin:0; font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; }
  header p{ margin:4px 0 0; font-size:11.5px; opacity:.9; }
  form{ padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label{ display:flex; flex-direction:column; gap:5px; font-size:11.5px; color:#aab3c8; font-weight:600; }
  label.full{ grid-column:1 / -1; }
  input,select{ padding:11px 12px; border-radius:10px; border:1px solid #2f3a5a;
    background:#141a2e; color:#eef2fb; font-size:14px; width:100%; }
  input:focus,select:focus{ outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.2); }
  .actions{ grid-column:1 / -1; display:flex; gap:10px; margin-top:4px; }
  .actions button{ flex:1; padding:12px; border-radius:10px; border:none; cursor:pointer; font-weight:700; font-size:14px; }
  .btn-sec{ background:#1c2540; color:#cfd6e8; border:1px solid #39436a !important; flex:0 0 auto !important; padding:12px 16px !important; }
  .btn-main{ color:#fff; background:linear-gradient(135deg,#6366f1,#22d3ee); }
  .btn-main:disabled{ opacity:.6; cursor:default; }
  .msg{ grid-column:1 / -1; padding:11px 13px; border-radius:10px; font-size:13px; line-height:1.5; display:none; }
  .msg.ok{ background:#0f2e1e; border:1px solid #1f6b43; color:#8ff0bd; display:block; }
  .msg.err{ background:#331418; border:1px solid #7a2630; color:#ffb3bd; display:block; }
  .msg.info{ background:#102033; border:1px solid #294a6b; color:#9ec9ff; display:block; }
  footer{ margin-top:auto; padding:12px 16px; text-align:center; font-size:10.5px; color:#6a7490; }
  @media(max-width:420px){ form{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🚀 Crear oportunidad</h1>
      <p>Anéxala a Impulsa. Elige asesor, campaña y moto de las listas.</p>
    </header>
    <form id="form" autocomplete="off">
      <label class="full">
        <span>Asesor *</span>
        <select name="asesorEmail" id="asesor" required><option value="">Cargando asesores…</option></select>
      </label>
      <label class="full">
        <span>Campaña *</span>
        <select name="Campanna" required>
          <option value="">Selecciona…</option>
          <option value="Mobility">Mobility</option>
          <option value="Redes">Redes</option>
          <option value="Sala">Sala</option>
          <option value="Referidos">Referidos</option>
        </select>
      </label>
      <label class="full">
        <span>Nombre del cliente *</span>
        <input name="NombreContacto" required placeholder="JUAN PEREZ GONZALEZ" />
      </label>
      <label>
        <span>Cédula * <small style="color:#7c88a6">(para cotizar)</small></span>
        <input name="Documento" required inputmode="numeric" placeholder="1015388115" />
      </label>
      <label>
        <span>Teléfono *</span>
        <input name="Telefono2" required inputmode="tel" placeholder="3001234567" />
      </label>
      <label class="full">
        <span>Correo (opcional)</span>
        <input name="Email" type="email" placeholder="cliente@correo.com" />
      </label>
      <label class="full">
        <span>Moto *</span>
        <select name="MotoSel" id="moto" required><option value="">Cargando catálogo…</option></select>
      </label>
      <label>
        <span>Género</span>
        <select name="CodigoGenero" id="genero"><option value="M">Masculino</option><option value="F">Femenino</option></select>
      </label>
      <label>
        <span>Precio (cotización)</span>
        <input name="Precio" id="precio" inputmode="numeric" placeholder="auto del catálogo" />
      </label>
      <div class="actions">
        <button type="reset" class="btn-sec">Limpiar</button>
        <button type="submit" class="btn-main" id="btn">🚀 Oportunidad</button>
        <button type="button" class="btn-main" id="btnCot" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">💰 Cotizar</button>
      </div>
      <div id="msg" class="msg"></div>
    </form>
    <footer>Serviautec · ventana de oportunidades · se queda abierta aunque navegues en otra pestaña</footer>
  </div>
<script>
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const $ = (id) => document.getElementById(id);
  const selAsesor = $("asesor"), selMoto = $("moto"), btn = $("btn"), msg = $("msg"), form = $("form");
  const showMsg = (html, tipo) => { msg.className = "msg " + (tipo||""); msg.innerHTML = html; };

  fetch("/api/asesores").then(r=>r.json()).then(d=>{
    if (d && d.ok) selAsesor.innerHTML = '<option value="">Selecciona asesor…</option>' +
      d.asesores.map(a=>`<option value="${esc(a.email)}">${esc(a.nombre)}</option>`).join("");
    else selAsesor.innerHTML = '<option value="">No se pudieron cargar</option>';
  }).catch(()=>{ selAsesor.innerHTML = '<option value="">No se pudieron cargar</option>'; });

  let MOTOS = [];
  fetch("/catalogo.json", {cache:"no-store"}).then(r=>r.json()).then(d=>{
    MOTOS = (d && d.motos || []).slice().sort((a,b)=>(a.marca+" "+a.modelo).localeCompare(b.marca+" "+b.modelo,"es"));
    selMoto.innerHTML = '<option value="">Selecciona moto…</option>' +
      MOTOS.map((m,i)=>`<option value="${esc(m.marca+"|"+m.modelo)}" data-i="${i}">${esc(m.marca+" — "+m.modelo)}</option>`).join("");
  }).catch(()=>{ selMoto.innerHTML = '<option value="">No se pudo cargar el catálogo</option>'; });
  // Autollenar el precio (comercial del catálogo) al elegir la moto
  selMoto.addEventListener("change", ()=>{
    const opt = selMoto.selectedOptions[0];
    const i = opt ? opt.dataset.i : null;
    if (i != null && MOTOS[i]) document.getElementById("precio").value = MOTOS[i].comercial || "";
  });

  form.addEventListener("submit", async (ev)=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const [marca, modelo] = String(fd.get("MotoSel")||"").split("|");
    const body = {
      asesorEmail: fd.get("asesorEmail"), Campanna: fd.get("Campanna"),
      NombreContacto: fd.get("NombreContacto"), Documento: fd.get("Documento"),
      Telefono2: fd.get("Telefono2"), Email: fd.get("Email"),
      Producto: modelo||"", Marca: marca||"",
    };
    const orig = btn.textContent; btn.disabled = true; btn.textContent = "Enviando…";
    showMsg("Enviando a Impulsa CRM…", "info");
    try {
      const r = await fetch("/api/crear-oportunidad", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
      const data = await r.json();
      if (data.ok) {
        showMsg(`✅ <strong>Oportunidad creada</strong> (${esc(data.ambiente||"?")})${data.idRegistro?` · ID ${esc(String(data.idRegistro))}`:""}.<br>Cliente <strong>${esc(body.NombreContacto)}</strong> — ${esc((body.Marca||"")+" "+(body.Producto||""))}.`, "ok");
        form.reset();
      } else {
        showMsg(`❌ <strong>No se pudo crear.</strong><br>${esc(String(data.error||("Status "+(data.status||"?"))))}`, "err");
      }
    } catch(e) { showMsg(`❌ <strong>Error de conexión:</strong> ${esc(e.message)}`, "err"); }
    finally { btn.disabled = false; btn.textContent = orig; }
  });

  // --- Botón COTIZAR → crea cotización en Impulsa (requiere cédula) ---
  document.getElementById("btnCot").addEventListener("click", async ()=>{
    const fd = new FormData(form);
    const [marca, modelo] = String(fd.get("MotoSel")||"").split("|");
    const opt = selMoto.selectedOptions[0];
    const i = opt ? opt.dataset.i : null;
    const anio = (i!=null && MOTOS[i]) ? MOTOS[i].anio : "2027";
    if (!String(fd.get("Documento")||"").trim()) { showMsg("Para cotizar necesitas la <strong>cédula</strong> del cliente.","err"); return; }
    const body = {
      NombreContacto: fd.get("NombreContacto"), Documento: fd.get("Documento"),
      Telefono2: fd.get("Telefono2"), Email: fd.get("Email"),
      CodigoGenero: fd.get("CodigoGenero"), Producto: modelo||"", Marca: marca||"",
      Modelo: anio, Precio: fd.get("Precio"), Cantidad: 1,
    };
    const btnc = document.getElementById("btnCot"); const o = btnc.textContent;
    btnc.disabled = true; btnc.textContent = "Cotizando…"; showMsg("Creando cotización en Impulsa…","info");
    try {
      const r = await fetch("/api/crear-cotizacion",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data = await r.json();
      if (data.ok) showMsg(`✅ <strong>Cotización creada en Impulsa</strong>${data.idRegistro?` · ID ${esc(String(data.idRegistro))}`:""}.<br>Cliente <strong>${esc(body.NombreContacto)}</strong> — ${esc((body.Marca||"")+" "+(body.Producto||""))}.`,"ok");
      else showMsg(`❌ <strong>No se pudo cotizar.</strong><br>${esc(String(data.error||("Status "+r.status)))}`,"err");
    } catch(e){ showMsg(`❌ <strong>Error de conexión:</strong> ${esc(e.message)}`,"err"); }
    finally { btnc.disabled=false; btnc.textContent=o; }
  });
</script>
</body>
</html>
